<text x="24" y="32" font-size="12" fill="#72847C" letter-spacing="2">HOW IT WORKS</text>
<g fill="#0B1611" stroke-width="1.2">
<rect x="24" y="56" width="176" height="52" rx="8" stroke="#F5B84D"/><rect x="24" y="120" width="176" height="52" rx="8" stroke="#4DA6FF"/><rect x="24" y="184" width="176" height="52" rx="8" stroke="#72847C"/>
