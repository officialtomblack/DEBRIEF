<g font-size="11" fill="#9FB5AA"><text x="38" y="96">.ndjson · Android app</text><text x="38" y="160">.kismet · laptop radio</text><text x="38" y="224">any wardriving export</text></g>
<rect x="262" y="56" width="156" height="180" rx="10" fill="#0B1611" stroke="#55F5A0" stroke-width="1.6"/>
<text x="340" y="88" font-size="18" font-weight="bold" fill="#55F5A0" text-anchor="middle" letter-spacing="3">DEBRIEF</text>
<line x1="282" y1="102" x2="398" y2="102" stroke="#1F3328"/>
<g font-size="12" fill="#CFE3D8"><text x="282" y="126">1 merge devices</text><text x="282" y="150">2 enrich offline</text><text x="282" y="174">3 score + flag</text><text x="282" y="198">4 audit itself</text></g>
<text x="282" y="222" font-size="11" fill="#72847C">no guessing, ever</text>
