<g font-size="13" font-weight="bold" fill="#E8FFF3"><text x="494" y="66">SQLite database</text><text x="494" y="120">Devices CSV</text><text x="494" y="174">GeoJSON map</text><text x="494" y="228">HTML report</text></g>
<g font-size="11" fill="#9FB5AA"><text x="494" y="82">query anything</text><text x="494" y="136">open in a spreadsheet</text><text x="494" y="190">places, on a map</text><text x="494" y="244">ranked, no coordinates</text></g>
<line x1="24" y1="268" x2="656" y2="268" stroke="#17261D"/>
<text x="24" y="290" font-size="11" fill="#9FB5AA">offline reference data, fetched once: IEEE · Bluetooth SIG · Wireshark · OSM ALPR cameras</text>
<text x="24" y="310" font-size="11" fill="#4DA6FF">opt-in online lookups: WiGLE · beaconDB (Wi-Fi access points only, never your GPS)</text>
