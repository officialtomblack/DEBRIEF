<svg viewBox="0 0 680 330" width="680" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How DEBRIEF works: SWIVEL phone logs, Kismet captures and WigleCSV go in; DEBRIEF merges, enriches offline, scores and audits; out come a SQLite database, a devices CSV, a GeoJSON map and an HTML report.">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#4A6B5A" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
